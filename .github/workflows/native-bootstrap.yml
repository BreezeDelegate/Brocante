name: Native materialize

on:
  push:
    branches:
      - agent/native-packaging

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/agent/native-packaging'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install existing dependencies
        run: npm ci

      - name: Add pinned Capacitor dependencies
        run: |
          npm install -w @brocante/web --save-exact @capacitor/core@8.4.2 @capacitor/android@8.4.2 @capacitor/ios@8.4.2
          npm install -w @brocante/web --save-dev --save-exact @capacitor/cli@8.4.2

      - name: Configure Capacitor
        run: |
          cat > apps/web/capacitor.config.json <<'EOF'
          {
            "appId": "com.breezedelegate.brocante",
            "appName": "Brocante",
            "webDir": "dist"
          }
          EOF

      - name: Build web bundle
        run: npm run build -w @brocante/web

      - name: Generate native projects
        working-directory: apps/web
        run: |
          npx cap add android
          npx cap add ios
          npx cap sync

      - name: Add native camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('apps/web/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          internet = '    <uses-permission android:name="android.permission.INTERNET" />'
          camera = '    <uses-permission android:name="android.permission.CAMERA" />'
          if camera not in text:
              text = text.replace(internet, camera + '\n' + internet)
          manifest.write_text(text)
          PY
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Utilisée pour photographier les objets à analyser." apps/web/ios/App/App/Info.plist

      - name: Build Android debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build iOS simulator app
        working-directory: apps/web/ios
        run: >-
          xcodebuild
          -project App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Audit generated tree
        run: |
          git diff --check
          if grep -RInE --exclude='*.png' --exclude='*.jpg' '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|EBAY_CLIENT_SECRET=|API_TOKEN=)' apps/web/android apps/web/ios; then
            echo 'Unexpected secret-like material in native tree' >&2
            exit 1
          fi

      - name: Commit generated native projects and remove bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/native-bootstrap.yml
          git add package-lock.json apps/web/package.json apps/web/capacitor.config.json apps/web/android apps/web/ios .github/workflows/native-bootstrap.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add verified Capacitor native projects'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
