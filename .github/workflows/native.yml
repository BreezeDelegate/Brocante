name: Native

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build web bundle
        run: npm run build -w @brocante/web

      - name: Sync native projects
        working-directory: apps/web
        run: npx cap sync

      - name: Build Android test APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build iOS simulator app
        working-directory: apps/web/ios
        run: >-
          xcodebuild
          -project App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify native configuration is reproducible
        run: |
          git diff --check
          git diff --exit-code -- \
            apps/web/android/app/src/main/assets \
            apps/web/android/app/src/main/assets/capacitor.config.json \
            apps/web/android/app/src/main/assets/capacitor.plugins.json \
            apps/web/ios/App/App/public \
            apps/web/ios/App/App/capacitor.config.json

      - name: Stage Android test APK
        run: cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk brocante-android-test.apk

      - name: Upload Android test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brocante-android-test
          path: brocante-android-test.apk
          if-no-files-found: error
          retention-days: 7
