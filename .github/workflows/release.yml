name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Package PWA
        run: |
          cd apps/web/dist
          zip -qr ../../../brocante-pwa.zip .
          cd ../../..
          sha256sum brocante-pwa.zip > brocante-pwa.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          brocante-pwa.zip
          brocante-pwa.zip.sha256
          --verify-tag
          --generate-notes
          --title "Brocante ${GITHUB_REF_NAME}"
