name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > brocante-sbom.cdx.json

      - name: Package PWA
        run: |
          cd apps/web/dist
          zip -qr ../../../brocante-pwa.zip .
          cd ../../..
          sha256sum brocante-pwa.zip brocante-sbom.cdx.json > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          brocante-pwa.zip
          brocante-sbom.cdx.json
          SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Brocante ${GITHUB_REF_NAME}"
