name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package-release.sh'
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Package release candidate
        run: bash scripts/package-release.sh

      - name: Upload packaged candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brocante-release-candidate
          path: release-out/
          if-no-files-found: error
          retention-days: 3

  publish:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v'))
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            release_tag="${GITHUB_REF_NAME#release/}"
            main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [[ "${GITHUB_SHA}" != "${main_sha}" ]]; then
              echo "Release branches must point exactly at current main." >&2
              exit 1
            fi
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Package tagged release
        run: bash scripts/package-release.sh

      - name: Create immutable tag when triggered by release branch
        if: startsWith(github.ref, 'refs/heads/release/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha 2>/dev/null || true)"
          if [[ -n "${existing_sha}" ]]; then
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} already points to another commit." >&2
              exit 1
            fi
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

          extra_flags=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            extra_flags+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            release-out/brocante-pwa.zip \
            release-out/brocante-android-test.apk \
            release-out/brocante-ios-xcode.zip \
            release-out/brocante-sbom.cdx.json \
            release-out/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Brocante ${RELEASE_TAG}" \
            "${extra_flags[@]}"
