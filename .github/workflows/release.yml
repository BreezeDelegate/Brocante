name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package-release.sh'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Package release candidate
        run: bash scripts/package-release.sh

      - name: Upload packaged candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brocante-release-candidate
          path: release-out/
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Package tagged release
        run: bash scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            extra_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release-out/brocante-pwa.zip \
            release-out/brocante-android-test.apk \
            release-out/brocante-ios-xcode.zip \
            release-out/brocante-sbom.cdx.json \
            release-out/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Brocante ${GITHUB_REF_NAME}" \
            "${extra_flags[@]}"
