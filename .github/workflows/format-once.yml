name: Format once

on:
  push:
    branches: [agent/bootstrap-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/bootstrap-v1

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Format target and remove bootstrap workflow
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write apps/api/src/services/browserPolicy.ts
          rm .github/workflows/format-once.yml

      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/services/browserPolicy.ts .github/workflows/format-once.yml
          git commit -m 'Normalize browser network policy formatting'
          git push origin HEAD:agent/bootstrap-v1
